# Cloudflare Worker (Workers & Pages → the "charikaexpress" project, connected to GitHub).
# Build command: sh build.sh  ·  Deploy command: npx wrangler deploy
# The site is built into dist/ by build.sh and served as static assets; /api/* runs server/worker.js.
name = "charikaexpress"
main = "server/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Shared database: client requests and team members
[[d1_databases]]
binding = "DB"
database_name = "charikaexpress"
database_id = "0876352c-d28d-4d57-bf81-606a9509aebf"

# Cloudflare Access (Zero Trust) protecting /admin and /api/admin:
# ACCESS_TEAM_DOMAIN = your team domain, e.g. "charikaexpress.cloudflareaccess.com"
# ACCESS_AUD = the "Application Audience (AUD) tag" of the Access application
# Until both are set, the team API refuses every call.
[vars]
ACCESS_TEAM_DOMAIN = "odd-violet-e6b7.cloudflareaccess.com"
ACCESS_AUD = "5bdf85e4b704fb07e895c54ddf7c5a7ef6059757df3ebe9cd70b11a7287b8c69"
